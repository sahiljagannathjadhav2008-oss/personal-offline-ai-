name: Build SJ Foundation AI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_instrumented:
        description: "Also run instrumented tests on an emulator"
        type: boolean
        default: false

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt
      - name: Run model, tokenizer, training and export tests
        working-directory: ml
        run: python -m pytest tests -q --junitxml=../ml-test-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-test-report
          path: ml-test-report.xml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create CI signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/sj-ci.jks" -storepass sjci1234 -keypass sjci1234 \
            -alias sjci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SJ Foundation AI CI"
          echo "SJ_KEYSTORE=$RUNNER_TEMP/sj-ci.jks" >> "$GITHUB_ENV"
          echo "SJ_KEYSTORE_PASSWORD=sjci1234" >> "$GITHUB_ENV"
          echo "SJ_KEY_ALIAS=sjci" >> "$GITHUB_ENV"
          echo "SJ_KEY_PASSWORD=sjci1234" >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK exists and is non-trivial
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          test -f "$APK" && test "$(stat -c%s "$APK")" -gt 5000000
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E "assets/(sj_model_int8.sjw|sj_tokenizer.json)"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump permissions "$APK" | tee perms.txt
          ! grep -qi INTERNET perms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SJ-Foundation-AI-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/

  instrumented:
    if: github.event_name == 'workflow_dispatch' && inputs.run_instrumented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
